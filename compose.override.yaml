services:
  web:
    command: bin/dev
    environment:
      APP_ENV: development
      RACK_ENV: development
      DATABASE_URL: postgres://wenthiking:wenthiking@postgres:5432/wenthiking_development
      PUBLIC_BASE_URL: http://localhost:9292
    volumes:
      - .:/app
    restart: unless-stopped
  worker:
    environment:
      APP_ENV: development
      RACK_ENV: development
      DATABASE_URL: postgres://wenthiking:wenthiking@postgres:5432/wenthiking_development
    volumes:
      - .:/app
  postgres:
    # Published on 55432 so host-side spec runs (mise ruby, no container) can
    # reach it; 5432 is left to other projects on this machine.
    ports:
      - "127.0.0.1:55432:5432"

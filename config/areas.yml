# Containing areas — national forests, wilderness, national parks — fetched
# by rake places:refresh_areas into the areas table (boundaries live in
# areas.boundary_json, not in git). Coverage matches the gazetteer's PNW-first
# scope: USFS regions 05 (California) and 06 (Oregon/Washington), wilderness
# clipped to the same footprint by a server-side envelope (the wilderness
# layer has no region attribute to filter on), and the four PNW national
# parks. Going national is widening these lists.
usfs_forests:
  regions: ["05", "06"]

wilderness:
  envelope:
    min_lat: 32.4
    max_lat: 49.1
    min_lon: -124.9
    max_lon: -114.1

nps_units:
  - slug: mount-rainier-national-park
    name: Mount Rainier National Park
    boundary_source_codes: [MORA]
    state_codes: wa
  - slug: olympic-national-park
    name: Olympic National Park
    boundary_source_codes: [OLYM]
    state_codes: wa
  - slug: north-cascades-national-park
    name: North Cascades National Park
    boundary_source_codes: [NOCA, LACH, ROLA]
    state_codes: wa
  - slug: crater-lake-national-park
    name: Crater Lake National Park
    boundary_source_codes: [CRLA]
    state_codes: or
